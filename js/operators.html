<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operators</title>
</head>
<body>
    <script>
        let a=12;
        let b=13;
        let c=a+b;
        alert("value is"=+c);
        let d=b-a;
        alert("value is"=+d);
        let e=a*b;
        alert("value is"=+e);
        let f=a/b;
        alert("value is"=+f);
    </script>
    
</body>
</html>
